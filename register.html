<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · Auth System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="register">
  <main class="card">
    <div class="logo">🔐</div>
    <h1>Create account</h1>
    <p class="sub">Sign up to get started.</p>
    <div id="message" class="alert" hidden role="alert"></div>
    <form id="form" novalidate>
      <label for="name">Full name</label>
      <input type="text" id="name" autocomplete="name" required />

      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required />

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" autocomplete="new-password" required />
        <button type="button" class="toggle-pw" data-target="password">Show</button>
      </div>

      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" required />

      <button class="btn" type="submit" id="submit">Create account</button>
    </form>
    <p class="footer-text">Already have an account? <a href="/login">Log in</a></p>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
