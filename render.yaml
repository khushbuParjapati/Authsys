# Render Blueprint: one web service serves BOTH the frontend (HTML/CSS/JS) and the backend (API).
services:
  - type: web
    name: auth-fullstack
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true      # Render creates a long random secret for you
      - key: MONGODB_URI
        sync: false              # paste your MongoDB Atlas string in the Render dashboard
      - key: BREVO_API_KEY
        sync: false              # for password-reset emails (see README)
      - key: MAIL_FROM
        sync: false              # e.g. Auth System <your-verified-sender@gmail.com>
      # APP_URL and TRUST_PROXY are optional on Render (detected automatically).
      # Set APP_URL only if you use a custom domain.
