<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard · Auth System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="dashboard">
  <main class="card wide" id="dash" hidden>
    <div class="topbar">
      <h1 id="welcome">Welcome</h1>
      <button class="btn danger inline" id="logout">Log out</button>
    </div>
    <section class="panel">
      <h2>Your profile</h2>
      <dl class="kv">
        <dt>Name</dt><dd id="p-name"></dd>
        <dt>Username</dt><dd id="p-username"></dd>
        <dt>Email</dt><dd id="p-email"></dd>
        <dt>Joined</dt><dd id="p-joined"></dd>
      </dl>
    </section>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
