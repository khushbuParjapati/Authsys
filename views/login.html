<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Auth System</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="login">
  <main class="card">
    <div class="logo">🔐</div>
    <h1>Welcome back</h1>
    <p class="sub">Log in with your email or username.</p>
    <div id="message" class="alert" hidden role="alert"></div>
    <form id="form" novalidate>
      <label for="identifier">Email or username</label>
      <input type="text" id="identifier" autocomplete="username" required />

      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" autocomplete="current-password" required />
        <button type="button" class="toggle-pw" data-target="password">Show</button>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" id="remember" /> Remember me</label>
        <a href="/forgot">Forgot password?</a>
      </div>

      <button class="btn" type="submit" id="submit">Log in</button>
    </form>
    <p class="footer-text">New here? <a href="/register">Create an account</a></p>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
